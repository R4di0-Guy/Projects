<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styl.css">
    <title>Stylizacja paznokci</title>
</head>
<body>
    <aside>
        <img src="manicure.jpg" alt="Stylizacja paznokci">
    </aside>
    <main>
        <header>
            <h1>Twoje wymarzone paznokcie</h1>
        </header>
        <nav>
            <button id="btn1">Kolor</button>
            <button id="btn2">Kształt</button>
            <button id="btn3">Wzór</button>
        </nav>
        <section id="sect1">
            <h2>Kolor</h2>
            <img src="kolory.png" alt="Kolory paznokci">
            <br>
            <input type="color" name="clr" id="clr" value="#FF0000">
        </section>
        <section id="sect2">
            <h2>Kształt</h2>
            <img src="ksztalt.png" alt="„Kształty paznokci">
            <br>
            <select name="slct" id="slct">
                <option value="migdał">migdał</option>
                <option value="zaokrąglony">zaokrąglony</option>
                <option value="kwadratowy">kwadratowy</option>
                <option value="balerina">balerina</option>
                <option value="zaokrąglony kwadrat">zaokrąglony kwadrat</option>
            </select>
        </section>
        <section id="sect3">
            <h2>Wzór</h2>
            <script>
                for(i=1;i<=10;i++){
                    document.write("<img class='wzory' title='"+i+"' src='"+i+".jpg' alt='"+i+"'>");
                }
            </script>
            <br>
            <input type="number" name="nmb" id="nmd" max="10" min="1">
        </section>
        <footer>
            <p>Autor strony: <i>R</i></p>
        </footer>
    </main>
    <script>
        const pierwszy=document.querySelector("#sect1");
        const drugi=document.querySelector("#sect2");
        const trzeci=document.querySelector("#sect3");
        const btns=document.querySelectorAll("button");
        const sekcje= document.querySelectorAll("section");
        document.querySelectorAll("button").forEach((e)=>{
            e.addEventListener("mouseenter",(btn)=>{
                btn_id=e.id;
                sekcje.forEach((sect)=>{sect.style.display="none"});
                btns.forEach((sect)=>{sect.style.backgroundColor="Crimson"});
                switch (btn_id){
                    case "btn1": 
                        pierwszy.style.display="block";
                        break;
                    case "btn2": 
                        drugi.style.display="block";
                        break;
                    case "btn3": 
                        trzeci.style.display="block";
                        break;
                }
                e.style.backgroundColor="Salmon";
            })
        })
    </script>
</body>
</html>
