<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stylizacja paznokci</title>
    <link rel="stylesheet" href="style_ai.css">
</head>
<body>

<aside id="boczny">
    <img src="manicure.jpg" alt="Stylizacja paznokci">
</aside>

<main id="glowny">

    <header>
        <h1>Twoje wymarzone paznokcie</h1>
    </header>

    <nav>
        <button id="btn1" onmouseover="pokazSekcje(1)">Kolor</button>
        <button id="btn2" onmouseover="pokazSekcje(2)">Kształt</button>
        <button id="btn3" onmouseover="pokazSekcje(3)">Wzór</button>
    </nav>

    <section id="sekcja1">
        <h2>Kolor</h2>

        <img src="kolory.png" alt="Kolory paznokci">

        <br><br>

        <input type="color" value="#FF0000">
    </section>

    <section id="sekcja2">
        <h2>Kształt</h2>

        <img src="ksztalt.png" alt="Kształty paznokci">

        <br><br>

        <select>
            <option>migdał</option>
            <option>zaokrąglony</option>
            <option>kwadratowy</option>
            <option>balerina</option>
            <option>zaokrąglony kwadrat</option>
        </select>
    </section>

    <section id="sekcja3">
        <h2>Wzór</h2>

        <script>
            for(let i = 1; i <= 10; i++) {
                document.write(
                    '<img src="' + i + '.jpg" class="wzory" title="' + i + '">'
                );
            }
        </script>

        <br><br>

        <input type="number" min="1" max="10">
    </section>

    <footer>
        <p>Autor strony: <em>TUTAJ_NUMER_ZDAJACEGO</em></p>
    </footer>

</main>

<script>
    function pokazSekcje(nr) {

        let sekcja1 = document.getElementById("sekcja1");
        let sekcja2 = document.getElementById("sekcja2");
        let sekcja3 = document.getElementById("sekcja3");

        let btn1 = document.getElementById("btn1");
        let btn2 = document.getElementById("btn2");
        let btn3 = document.getElementById("btn3");

        sekcja1.style.display = "none";
        sekcja2.style.display = "none";
        sekcja3.style.display = "none";

        btn1.style.backgroundColor = "Crimson";
        btn2.style.backgroundColor = "Crimson";
        btn3.style.backgroundColor = "Crimson";

        if(nr == 1) {
            sekcja1.style.display = "block";
            btn1.style.backgroundColor = "Salmon";
        }

        if(nr == 2) {
            sekcja2.style.display = "block";
            btn2.style.backgroundColor = "Salmon";
        }

        if(nr == 3) {
            sekcja3.style.display = "block";
            btn3.style.backgroundColor = "Salmon";
        }
    }
</script>

</body>
</html>
