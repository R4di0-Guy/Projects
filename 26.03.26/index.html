<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lista Zadań</title>
    <style>
        header{
            text-align: center;
            width: 50%;
            margin: auto;
            background-color: wheat;
            border-bottom:5px darkred solid;
        }
        h1{
            margin-bottom: 0;
        }
        /* .kwadrat{
            background-color: black;
            width: 150px;
            height: 150px;
            border: red 1px solid;
        } */
        form{
            width: 50%;
            margin: auto;
            text-align: center;
            box-shadow: 4px 8px 8px dimgray;
            background-color: wheat;
            padding-top: 5px;
        }
        input, label,button{
            font-size: 16px;
        }
        button, input[type="submit"]{
            background-color: dimgray;
            color: white;
            margin: 10px 0;
        }
        button:hover, input[type="submit"]:hover{
            background-color: darkslategrey;
            
        }
        .done{
            background-color: coral;
            margin: 5px 0;
        }
        .done:hover{
            background-color: chocolate;
        }
    </style>
</head>
<body>
    <header><h1>Lista Zadań</h1></header>
    <form action="" method="post">
        <section>
            <!-- <label for="zadanie1">zadanie 1:</label><input type="text" name="zadanie1" id="zadanie1"><button class="done">Zrobione</button> -->
        </section>
        <button id="dodaj">dodaj</button>
        <input type="submit" value="wyslij">
    </form>
    <script>
        let pozycja=0
        const form=document.querySelector("section");
        document.querySelector("#dodaj").addEventListener("click",(e)=>{
            e.preventDefault();
            pozycja++;
            let new_label=document.createElement("label");
            new_label.setAttribute('for','dodaj'+pozycja);
            new_label.innerHTML="zadanie "+pozycja+":";
            form.appendChild(new_label);
            
            let new_inp=document.createElement("input");
            new_inp.setAttribute('name','dodaj'+pozycja);
            new_inp.type="text";
            new_inp.id="zadanie"+pozycja;
            form.appendChild(new_inp);

            let new_btn=document.createElement("button");
            new_btn.innerHTML="Zrobione";
            new_btn.classList.add("done");
            form.appendChild(new_btn);
            form.appendChild(document.createElement("br"));
            
            document.querySelectorAll(".done").forEach((btn)=>{
            btn.addEventListener("click",(e)=>{
                e.preventDefault();
                // console.log(btn.previousSibling)
                btn.previousElementSibling.style.textDecoration="line-through";
            })
        })
        })
    </script>
