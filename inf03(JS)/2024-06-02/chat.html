<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Chat</title>
    <link rel="stylesheet" href="styl.css">
</head>
<body>
    <header>
        <h2>Chat</h2>
    </header>
     <div id="boczny">
        <h3>Chaty</h3>
        <ul>
            <li>Ogólny</li>
            <li>Tematyczne</li>
            <ol>
                <li>Turystyczny</li>
                <li>Żeglarski</li>
                <li>Filatelistyczny</li>
                <li>Hodowla zwierzątek domowych</li>
            </ol>
        </ul>
        <h3>Uczestnicy</h3>
        <p>Jolanta Nowak</p>
        <img src="Jolka.jpg" alt="Jolanta Nowak">
        <p>Krzysztof Łukasiński</p>
        <img src="Krzysiek.jpg" alt="Krzysztof Łukasiński">
    </div>
    <main>
        <div id="chat">
            <div class="Jolanta">
                <img src="Jolka.jpg">
                <p>Cześć idziesz jutro do kina?</p>
            </div>
            <div class="Krzysztof">
                <img src="Krzysiek.jpg">
                <p>Tak! A ty?</p>
            </div>
        </div>
        Wpisz wiadomość:
        <input type="text">
        <button id="wyslij">Wyślij</button><br>
        <button id="losowa_odpowiedz">Generuj losową odpowiedź</button>   
    </main>
    <footer>
        <h5>Chat wykonał: R</h5>
    </footer>
    <script>
        document.querySelector("#wyslij").addEventListener("click",()=>{
            let tekst=document.querySelector("input").value;
            document.querySelector("#chat").innerHTML+=`
            <div class="Jolanta">
                <img src="Jolka.jpg">
                <p>`+tekst+`</p>
            </div>
            `
            document.querySelector("#chat").scrollTop=document.querySelector("#chat").scrollHeight
        })
        const odpowiedzi=[
            "Świetnie!",
            "Kto gra główną rolę?",
            "Lubisz filmy Tego reżysera?",
            "Będę 10 minut wcześniej",
            "Może kupimy sobie popcorn?",
            "Ja wolę Colę",
            "Zaproszę jeszcze Grześka",
            "Tydzień temu też byłem w kinie na Diunie",
            "Ja funduję bilety"
        ];
        document.querySelector("#losowa_odpowiedz").addEventListener("click",()=>{
            random_number=Math.floor(Math.random()*8);
            console.log(random_number)
            document.querySelector("#chat").innerHTML+=`
            <div class="Krzysztof">
                <img src="Krzysiek.jpg">
                <p>`+odpowiedzi[random_number]+`</p>
            </div>
            `
            document.querySelector("#chat").scrollTop=document.querySelector("#chat").scrollHeight
        })
    </script>
</body>
</html>
