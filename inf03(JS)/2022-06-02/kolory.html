<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Pomocnik CSS</title>
    <link rel="stylesheet" href="styl2.css">
</head>
<body>
    <div id="kontener">
        <header>
            <h1>Pomocnik CSS</h1>
        </header>
        <header>
            <ul>
               <li><a href="kolory.html">Kolory</a></li>
               <li><a href="czcionki.html">Czcionki</a></li>
               <li><a href="style.html">Style CSS</a></li>
               <li><a target="_blank" href="https://www.w3schools.com/css/">Pomoc</a></li>
            </ul>
        </header>
        <main>
            <h2>Podaj składową H koloru w kodzie HSL</h2>
            <p>0 do 30 czerwienie, do 60 żółcie, do 150 zielenie, do 250 niebieskie, do 360 fiolet i purpura</p>
            <img src="kolory.jpg" alt="Przestrzeń barw HSL"><br>
            <input type="number" name="num" placeholder="0 – 360" max="360">
            <button>Generuj paletę</button>
            <table>
                <tr><td colspan="4" id="kolor">Kolor główny</td></tr>
                <tr>
                    <td id="kolor2">kolor 2</td>
                    <td id="kolor3">kolor 3</td>
                    <td id="kolor4">kolor 4</td>
                    <td id="kolor5">kolor 5</td>
                </tr>
            </table>
        </main>
        <footer>
            <p>Autor: R</p>
        </footer>
    </div>
    <script>
        document.querySelector("button").addEventListener("click",()=>{
            let H=document.querySelector("input").value;
            const L="50%";
            document.querySelector("#kolor").style.backgroundColor="hsl("+H+",100%,"+L+")";
            document.querySelector("#kolor2").style.backgroundColor="hsl("+H+",80%,"+L+")";
            document.querySelector("#kolor3").style.backgroundColor="hsl("+H+",60%,"+L+")";
            document.querySelector("#kolor4").style.backgroundColor="hsl("+H+",40%,"+L+")";
            document.querySelector("#kolor5").style.backgroundColor="hsl("+H+",20%,"+L+")";
        })
    </script>
</body>
</html>
